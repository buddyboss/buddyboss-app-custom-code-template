buildscript {
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }

        dependencies {
            classpath "com.android.tools.build:gradle:9.2.1"
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace = "com.buddybosscustomcode"
    compileSdk = safeExtGet("BuddybossCustomCode_compileSdkVersion", 36)

    defaultConfig {
        minSdk = safeExtGet("BuddybossCustomCode_minSdkVersion", 26)
        targetSdk = safeExtGet("BuddybossCustomCode_targetSdkVersion", 36)
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    lint {
        disable.add("GradleCompatible")
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation "com.facebook.react:react-android"
}
