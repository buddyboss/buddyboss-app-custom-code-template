buildscript {
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }

        dependencies {
            classpath "com.android.tools.build:gradle:8.7.2"
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "com.buddybosscustomcode"
    compileSdkVersion safeExtGet("BuddybossCustomCode_compileSdkVersion", 36)

    defaultConfig {
        minSdkVersion safeExtGet("BuddybossCustomCode_minSdkVersion", 26)
        targetSdkVersion safeExtGet("BuddybossCustomCode_targetSdkVersion", 36)
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lintOptions {
        disable "GradleCompatible"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation "com.facebook.react:react-android"
}
